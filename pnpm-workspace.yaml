allowBuilds:
  esbuild: true
  unrs-resolver: true
  '@parcel/watcher': true
minimumReleaseAgeExclude:
  - '@book000/*'
# @discordjs/builders pins shapeshift ^4, whose type definitions reference util.InspectOptionsStylized (removed in Node 26) and fail type checking. Remove this once @discordjs/builders supports shapeshift 5.
overrides:
  '@sapphire/shapeshift': 5.0.0
